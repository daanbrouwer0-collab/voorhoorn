name: Update agenda cache

on:
  schedule:
    # Elke ochtend ~06:15 UTC (= 08:15 NL-tijd)
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bouw de agenda zoals Web Agenda
        run: node scripts/build-agenda.mjs

      - name: Commit als er wijzigingen zijn
        run: |
          if git diff --quiet -- agenda-data.json; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda-data.json
          git commit -m "chore: update agenda-cache (dagelijkse scrape)"
          git push
