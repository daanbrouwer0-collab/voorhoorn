name: Update agenda cache

on:
  schedule:
    # Elke ochtend ~06:15 UTC (= 08:15 NL-tijd)
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape alle agenda-bronnen
        run: python3 scripts/scrape-agenda.py

      - name: Commit als er wijzigingen zijn
        run: |
          if git diff --quiet -- agenda-data.json raad-agenda.json netwerk-kids-agenda.json; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda-data.json raad-agenda.json netwerk-kids-agenda.json
          git commit -m "chore: update agenda-cache (dagelijkse scrape)"
          git push
