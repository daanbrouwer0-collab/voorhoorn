<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lappendag</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="site-loading">
        <div class="loader-container">
            <div class="spinner"></div>
            <p class="loading-text">Lappendag laden…</p>
        </div>
    </div>

    <iframe id="site-frame" title="Lappendag" allow="fullscreen; autoplay"></iframe>

    <div id="site-error" hidden>
        <div class="error-box">
            <h2>Fout bij laden</h2>
            <p id="error-message">Kon de Lappendag-site niet laden vanaf GitHub.</p>
            <button id="retry-btn" onclick="location.reload()">Opnieuw proberen</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
