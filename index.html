<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Voorhoorn - Welkom op de site">
    <title>Voorhoorn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    <div class="background-grid"></div>

    <main class="container">
        <div class="card" id="mainCard">
            <div class="badge">Welkom</div>
            <h1 class="title">Voorhoorn</h1>
            <p class="subtitle">Klik hieronder om direct naar het <strong>Lappendag</strong> project te gaan.</p>

            <div class="button-group">
                <a href="https://github.com/daanbrouwer0-collab/Lappendag" 
                   id="lappendagBtn" 
                   class="btn btn-primary" 
                   target="_blank" 
                   rel="noopener noreferrer">
                    <span class="btn-icon">🏮</span>
                    <span class="btn-text">Ga naar Lappendag</span>
                    <svg class="arrow-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </a>
            </div>

            <div class="info-footer">
                <a href="https://daanbrouwer0-collab.github.io/Lappendag/" 
                   class="secondary-link" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   id="githubPagesLink">
                    🌐 Open GitHub Pages versie
                </a>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
